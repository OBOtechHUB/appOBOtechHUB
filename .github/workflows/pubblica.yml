name: Test e pubblicazione su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Installa dipendenze
        run: bun install
      - name: Test
        run: bun run test
      - name: Controllo dei tipi
        run: bun run typecheck
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VERSIONE: ${{ github.sha }}
        run: |
          bun run build
          echo "{\"versione\":\"${GITHUB_SHA}\"}" > dist/version.json
      # Prova della build: se una pagina non si avvia la pubblicazione si ferma (online resta la versione di prima)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prova della build nel browser
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          PW_DIR: /tmp/pw
        run: |
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm install --no-save playwright@1.48.2 >/dev/null)
          (cd /tmp/pw && (timeout 180 npx playwright install --with-deps chromium >/dev/null || true) && npx playwright install chromium >/dev/null)
          node scripts/prova-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
