name: Disegni 2D prodotti OBO

# Copia i disegni 2D pubblici dei prodotti OBO (protezione esterna, terra) in public/obo-disegni per
# l'editor dei tipologici; poi ripubblica l'app. Non cancella mai i disegni già scaricati.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 0"
  push:
    branches: [main]
    paths: ["scripts/disegni-obo.mjs", ".github/workflows/disegni-obo.yml", "public/dati/obo-prodotti.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: disegni-obo
  cancel-in-progress: false

jobs:
  disegni:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica i disegni nuovi
        run: node scripts/disegni-obo.mjs
      - name: Salva nel repository
        id: salva
        run: |
          git config user.name "disegni-obo"
          git config user.email "disegni-obo@users.noreply.github.com"
          git add public/obo-disegni
          if git diff --cached --quiet; then echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Disegni 2D dei prodotti OBO aggiornati"
          git pull --rebase origin main
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"
      - name: Ripubblica l'app
        if: steps.salva.outputs.cambiato == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pubblica.yml --ref main -R "${{ github.repository }}"
