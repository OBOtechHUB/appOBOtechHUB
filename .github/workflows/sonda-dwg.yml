name: Sonda libreria DWG (temporanea)
on:
  push:
    branches: [sonda-dwg]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir c && cd c && git init -q && git checkout -q -b c
          curl -sfL -o example_2000.dwg https://raw.githubusercontent.com/LibreDWG/libredwg/master/test/test-data/example_2000.dwg
          curl -sfL -o example_2018.dwg https://raw.githubusercontent.com/LibreDWG/libredwg/master/test/test-data/example_2018.dwg
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm campioni
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" c:refs/heads/campioni-dwg-prova
