name: Prova di un ramo (senza pubblicare)

on:
  push:
    branches-ignore: [main, "backup-*"]

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Installa dipendenze
        run: bun install
      - name: Test
        run: bun run test
      - name: Controllo dei tipi
        run: bun run typecheck
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: bun run build
      - name: Salva la build per la prova
        uses: actions/upload-artifact@v4
        with:
          name: build-prova
          path: dist
          retention-days: 3
