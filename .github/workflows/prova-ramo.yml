name: Prova di un ramo (senza pubblicare)

on:
  push:
    branches-ignore: [main, "backup-*"]

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Installa dipendenze
        run: bun install
      - name: Test
        run: bun run test
      - name: Controllo dei tipi
        run: bun run typecheck
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build
      - name: Salva la build in un ramo (per provarla)
        run: |
          cd dist
          git init -q && git checkout -q -b build
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build di prova ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build:refs/heads/build-prova
