name: Prova di un ramo (senza pubblicare)

on:
  push:
    branches-ignore: [main, "backup-*"]

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Installa dipendenze
        run: bun install
      - name: Test
        run: bun run test
      - name: Controllo dei tipi
        run: bun run typecheck
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build
      # Prova della build: se una pagina non si avvia la pubblicazione si ferma (online resta la versione di prima)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prova della build nel browser
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          PW_DIR: /tmp/pw
        run: |
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm install --no-save playwright@1.48.2 >/dev/null)
          (cd /tmp/pw && (timeout 180 npx playwright install --with-deps chromium >/dev/null || true) && npx playwright install chromium >/dev/null)
          node scripts/prova-build.mjs
      - name: Salva la build in un ramo (per provarla)
        run: |
          cd dist
          git init -q && git checkout -q -b build
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build di prova ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build:refs/heads/build-prova
