name: Catalogo prodotti OBO

# Legge le pagine pubbliche dei prodotti OBO (protezione esterna, sovratensioni, terra) e aggiorna
# public/dati/obo-prodotti.json; poi ripubblica l'app. Si avvia a mano, ogni mese e quando cambia lo script.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths: ["scripts/catalogo-obo.mjs", ".github/workflows/catalogo-obo.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogo-obo
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leggi il catalogo OBO
        run: node scripts/catalogo-obo.mjs
      - name: Salva il catalogo nel repository
        id: salva
        run: |
          git config user.name "catalogo-obo"
          git config user.email "catalogo-obo@users.noreply.github.com"
          git add public/dati/obo-prodotti.json public/dati/obo-novita.json
          if git diff --cached --quiet; then echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Catalogo prodotti OBO aggiornato"
          git pull --rebase origin main
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"
      - name: Ripubblica l'app
        if: steps.salva.outputs.cambiato == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pubblica.yml --ref main -R "${{ github.repository }}"
