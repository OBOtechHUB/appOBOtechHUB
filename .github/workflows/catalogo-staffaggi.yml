name: Catalogo staffaggi OBO

# Legge le pagine pubbliche OBO dei sistemi portacavi e di staffaggio (passerelle, binari MS, mensole,
# supporti) con i dati tecnici e statici, per l'app Staffaggi OBO. Salva public/dati/obo-staffaggi.json.
# Si avvia a mano, ogni mese e quando cambia questo file.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 2 * *"
  push:
    branches: [main]
    paths: [".github/workflows/catalogo-staffaggi.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogo-staffaggi
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leggi il catalogo OBO dei sistemi portacavi
        env:
          RADICI: cable-support-systems
          USCITA: public/dati/obo-staffaggi.json
          NOVITA: public/dati/obo-staffaggi-novita.json
          MAX_PAGINE: "9000"
          PAUSA_MS: "2000"
        run: node scripts/catalogo-obo.mjs
      - name: Salva il catalogo nel repository
        id: salva
        run: |
          git config user.name "catalogo-obo"
          git config user.email "catalogo-obo@users.noreply.github.com"
          git add public/dati/obo-staffaggi.json public/dati/obo-staffaggi-novita.json
          if git diff --cached --quiet; then echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Catalogo staffaggi OBO aggiornato"
          git pull --rebase origin main
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"
      - name: Ripubblica l'app
        if: steps.salva.outputs.cambiato == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pubblica.yml --ref main -R "${{ github.repository }}"
