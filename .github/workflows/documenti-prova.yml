name: Prova notturna dei documenti

# Ogni notte genera tutti i documenti dal progetto di prova completo (src/calcoli/prova/progettoProva.ts):
# relazione tecnica, dichiarazione di conformità, verbale, piano delle verifiche, offerta Word/Excel,
# tipologico disegnato e tavola DXF. Controlla che i file Word siano integri e li allega alla prova
# (Actions → Prova notturna dei documenti → Artifacts) per 30 giorni. Se qualcosa si rompe la prova
# fallisce e GitHub avvisa per email. Dati inventati, nessun accesso al database.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths: ["scripts/documenti-prova.ts", "src/calcoli/prova/**", ".github/workflows/documenti-prova.yml"]

jobs:
  documenti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Dipendenze
        run: |
          bun install
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null
      - name: Genera i documenti
        run: bun scripts/documenti-prova.ts documenti-prova
      - name: Controlla i file
        run: |
          set -e
          n=0
          for f in documenti-prova/*.docx documenti-prova/*.xlsx; do
            unzip -tq "$f" > /dev/null || { echo "File rovinato: $f"; exit 1; }
            unzip -p "$f" "[Content_Types].xml" > /dev/null
            n=$((n+1))
          done
          test -s documenti-prova/08-Tavola-LPS.dxf
          grep -q "EOF" documenti-prova/08-Tavola-LPS.dxf
          echo "File controllati: $n"; cat documenti-prova/LEGGIMI.txt
      - uses: actions/upload-artifact@v4
        with:
          name: documenti-prova
          path: documenti-prova
          retention-days: 30
