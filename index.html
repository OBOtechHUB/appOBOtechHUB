<!doctype html>
<html lang="it">
  <head>
    <script>
      // Pagina rimasta in memoria dopo una nuova pubblicazione: i suoi file non esistono più e resterebbe bianca.
      // Se un file dell'app non si carica, ricarica una volta la pagina aggiornata dal server.
      window.addEventListener("error", function (e) {
        var t = e.target; if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
        if (String(t.src || t.href || "").indexOf("/assets/") < 0) return;
        try { if (sessionStorage.getItem("lps-ricaricata")) return; sessionStorage.setItem("lps-ricaricata", "1"); } catch (x) { return; }
        var q = location.search.replace(/([?&])v=\d+&?/, "$1").replace(/[?&]$/, "");
        location.replace(location.pathname + q + (q ? "&" : "?") + "v=" + Date.now() + location.hash);
      }, true);
      window.addEventListener("load", function () { setTimeout(function () { try { sessionStorage.removeItem("lps-ricaricata"); } catch (x) {} }, 5000); });
    </script>
    <script>
      // Indirizzo con maiuscole/minuscole diverse (es. /appobotechhub/admin): lo riporta a quello esatto dell'app.
      (function () { var b = "%BASE_URL%", l = location.pathname;
        if (b.length > 1 && l.toLowerCase().indexOf(b.toLowerCase()) === 0 && l.indexOf(b) !== 0) history.replaceState(null, "", b + l.slice(b.length) + location.search + location.hash);
        else if (b.length > 1 && (l + "/").toLowerCase() === b.toLowerCase() && l + "/" !== b) history.replaceState(null, "", b + location.search + location.hash); })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>try{var t=localStorage.getItem("obo-tema");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
    <meta name="application-name" content="Progettazione LPS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LPS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icona.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Progettazione LPS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
